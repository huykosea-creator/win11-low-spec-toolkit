ReleaseNotes: '- Added GeForce 50 Hot Spot thermal sensor and the hottest memory chip
  is also reported (tooltip shows all memory chip temperatures)

  - Added an "overclocking" readout on the advanced tab for NVIDIA, reporting OC frequencies,
  including XBAR, SYS, video clock and boost lock status

  - Added support for reading NVIDIA SYS, L2 and Video clocks. These can be enabled
  in sensor settings, they are disabled by default

  - Added a sensor that reports PCI-Express bandwidth throughput numbers in GB/s for
  NVIDIA GPUs

  - When a sensor is not logged to file, its dropdown arrow on the sensors tab will
  be grayed out

  - Fixed NVIDIA GP102 transistor count

  - Fixed LPDDR5X memory detection on Intel Meteor Lake and Arrow Lake

  - Fixed LPDDR5 frequency on Intel Alder Lake

  - Fixed memory bandwidth reporting on some DDR5 systems

  - Fixed Qualcomm Adreno 726 unit counts

  - Added support for NVIDA RTX 5060 (GB205), RTX 4070 10 GB, RTX PRO 4500 Blackwell
  Server, H100 PCIe variant, Tesla V100-SXM2-16GB variant, P102-101

  - Added support for AMD Steam Machine GPU and Radeon PRO V710 (second variant)

  - Added support for Intel Panther Lake, Lunar Lake, Arrow Lake H (285H, 265H, 255H,
  235H, 225H), RPL-H Refresh (240H, 210H), Twin Lake (N355, N350, N250, N150)

  - Added support for Qualcomm Snapdragon X2-90, X2-85, X2-45'
