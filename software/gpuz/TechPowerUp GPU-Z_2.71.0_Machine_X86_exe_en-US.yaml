Description: 'GPU-Z is a lightweight system utility designed to provide vital information
  about your video card and graphics processor.

  Main Features

  - Supports NVIDIA, AMD, ATI and Intel graphics devices

  - Displays adapter, GPU and display information

  - Displays overclock, default clocks and 3D/boost clocks (if available)

  - Detailed reporting on memory subsystem: memory size, type, speed, bus width

  - Includes a GPU load test to verify PCI-Express lane configuration

  - Validation of results

  - GPU-Z can create a backup of your graphics card BIOS

  - No installation required, optional installer is available

  - Support for Windows 11 / Windows 10 / Windows 8 / Windows 7 / Vista / Windows
  XP (both 32 and 64 bit versions are supported)

  - .. and yes, the author of CPU-Z has granted us permission to use a name similar
  to his product. Thanks Franck.'
ShortDescription: GPU-Z is a lightweight system utility designed to provide vital
