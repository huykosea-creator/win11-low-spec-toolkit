<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="aipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#aipBg)"/>
  <!-- Radar / Network ring -->
  <circle cx="22" cy="22" r="11" fill="none" stroke="#BAE6FD" stroke-width="2.2"/>
  <circle cx="22" cy="22" r="5.5" fill="none" stroke="#E0F2FE" stroke-width="1.8" stroke-dasharray="3 2"/>
  <circle cx="22" cy="22" r="2.2" fill="#38BDF8"/>
  <!-- Magnifying glass handle -->
  <line x1="30" y1="30" x2="38" y2="38" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- IP badge -->
  <rect x="14" y="18" width="16" height="8" rx="2" fill="#FFFFFF"/>
  <text x="22" y="24.2" text-anchor="middle" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="7.5">IP LAN</text>
</svg>
